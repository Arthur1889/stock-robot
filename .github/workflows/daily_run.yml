name: Daily Stock Robot

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'qdii_cache.json'
  # 原自带 schedule 定时队列常有数小时严重延迟，现改由 Cloudflare Workers Cron 精准触发 workflow_dispatch
  # schedule:
  #   # 每天北京时间 07:45 晨报 (UTC 23:45，周日至周四)
  #   - cron: '45 23 * * 0-4'
  #   # 每天北京时间 15:15 盘后 (UTC 07:15，周一至周五)
  #   - cron: '15 7 * * 1-5'
  workflow_dispatch: # 允许通过 API (如 Cloudflare Worker) 或手动点按钮触发
    inputs:
      force_run:
        description: '是否强制运行 (忽略交易日检查)'
        required: false
        default: false
        type: boolean

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: pip install -r requirements.txt

      - name: 执行推送脚本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: python main.py

      - name: 提交并推送缓存更新
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add qdii_cache.json
          git diff --staged --quiet || (git commit -m "Auto-update QDII cache [skip ci]" && git push)
        continue-on-error: true
